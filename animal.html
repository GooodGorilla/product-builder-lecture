<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트 - 나는 강아지상? 고양이상?</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        #webcam-section, #upload-section {
            display: none;
        }

        #webcam-section.active, #upload-section.active {
            display: block;
        }

        #webcam-container {
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            display: inline-block;
        }

        #webcam-container canvas {
            border-radius: 16px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #drop-area {
            border: 3px dashed #ccc;
            border-radius: 16px;
            padding: 40px 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #drop-area:hover, #drop-area.highlight {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        #drop-area p {
            color: #666;
            margin-bottom: 10px;
        }

        #drop-area .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        #file-input {
            display: none;
        }

        #preview-container {
            margin: 20px 0;
            display: none;
        }

        #preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 16px;
            background: #f8f9fa;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result-dog {
            color: #e67e22;
        }

        .result-cat {
            color: #9b59b6;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .probability-bars {
            margin-top: 20px;
        }

        .prob-item {
            margin: 10px 0;
            text-align: left;
        }

        .prob-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .prob-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .prob-fill.dog {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }

        .prob-fill.cat {
            background: linear-gradient(90deg, #9b59b6, #8e44ad);
        }

        .description {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            color: #555;
            line-height: 1.6;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>동물상 테스트</h1>
        <p class="subtitle">AI가 분석하는 나의 동물상! 강아지상일까, 고양이상일까?</p>

        <div class="mode-buttons">
            <button class="mode-btn active" id="webcam-mode-btn">웹캠</button>
            <button class="mode-btn" id="upload-mode-btn">사진 업로드</button>
        </div>

        <!-- Webcam Section -->
        <div id="webcam-section" class="active">
            <div id="webcam-container"></div>
            <button class="start-btn" id="webcam-start-btn">웹캠 시작하기</button>
        </div>

        <!-- Upload Section -->
        <div id="upload-section">
            <div id="drop-area">
                <div class="icon">📷</div>
                <p>이미지를 드래그하거나 클릭하여 업로드</p>
                <p style="font-size: 0.9rem; color: #999;">JPG, PNG 파일 지원</p>
            </div>
            <input type="file" id="file-input" accept="image/*">
            <div id="preview-container">
                <img id="preview-image" alt="Preview">
            </div>
            <button class="start-btn" id="analyze-btn" style="display: none;">분석하기</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">AI가 분석중...</p>
        </div>

        <div class="result-container" id="result-container">
            <div class="result-icon" id="result-icon"></div>
            <div class="result-title" id="result-title"></div>
            <div class="probability-bars" id="probability-bars"></div>
            <div class="description" id="result-description"></div>
        </div>

        <a href="index.html" class="back-link">← 메인으로 돌아가기</a>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/UzquT-lRD/";

        let model, webcam, maxPredictions;
        let isWebcamRunning = false;

        const descriptions = {
            dog: [
                "당신은 밝고 활발한 강아지상! 사람들에게 친근하게 다가가고, 항상 긍정적인 에너지를 뿜어내는 매력의 소유자입니다.",
                "충성스럽고 따뜻한 마음을 가진 강아지상이시네요! 친구와 가족을 소중히 여기며, 함께 있으면 편안한 분위기를 만들어주는 타입입니다.",
                "사교적이고 에너지 넘치는 강아지상! 새로운 사람과도 금방 친해지는 매력을 가지고 있어요."
            ],
            cat: [
                "당신은 우아하고 독립적인 고양이상! 자신만의 세계가 뚜렷하고, 신비로운 매력으로 사람들의 호기심을 자극합니다.",
                "도도하지만 은근히 애교있는 고양이상이시네요! 쉽게 마음을 열지 않지만, 한번 친해지면 끈끈한 유대감을 보여주는 타입입니다.",
                "세련되고 지적인 고양이상! 혼자만의 시간을 즐기면서도 묘한 카리스마로 주변을 사로잡는 매력이 있어요."
            ]
        };

        // Mode switching
        document.getElementById('webcam-mode-btn').addEventListener('click', () => {
            document.getElementById('webcam-mode-btn').classList.add('active');
            document.getElementById('upload-mode-btn').classList.remove('active');
            document.getElementById('webcam-section').classList.add('active');
            document.getElementById('upload-section').classList.remove('active');
            hideResult();
        });

        document.getElementById('upload-mode-btn').addEventListener('click', () => {
            document.getElementById('upload-mode-btn').classList.add('active');
            document.getElementById('webcam-mode-btn').classList.remove('active');
            document.getElementById('upload-section').classList.add('active');
            document.getElementById('webcam-section').classList.remove('active');
            stopWebcam();
            hideResult();
        });

        // Webcam functions
        document.getElementById('webcam-start-btn').addEventListener('click', async () => {
            if (!isWebcamRunning) {
                await initWebcam();
            }
        });

        async function initWebcam() {
            const btn = document.getElementById('webcam-start-btn');
            btn.textContent = '로딩중...';
            btn.disabled = true;

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true;
                webcam = new tmImage.Webcam(300, 300, flip);
                await webcam.setup();
                await webcam.play();

                isWebcamRunning = true;
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").innerHTML = '';
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                btn.textContent = '분석중...';
            } catch (error) {
                console.error('Webcam error:', error);
                btn.textContent = '웹캠 시작하기';
                btn.disabled = false;
                alert('웹캠을 시작할 수 없습니다. 카메라 권한을 확인해주세요.');
            }
        }

        async function loop() {
            if (!isWebcamRunning) return;
            webcam.update();
            await predictWebcam();
            window.requestAnimationFrame(loop);
        }

        async function predictWebcam() {
            const prediction = await model.predict(webcam.canvas);
            displayResult(prediction);
        }

        function stopWebcam() {
            if (webcam && isWebcamRunning) {
                webcam.stop();
                isWebcamRunning = false;
                document.getElementById("webcam-container").innerHTML = '';
                document.getElementById('webcam-start-btn').textContent = '웹캠 시작하기';
                document.getElementById('webcam-start-btn').disabled = false;
            }
        }

        // Upload functions
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const analyzeBtn = document.getElementById('analyze-btn');

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('highlight');
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('highlight');
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('highlight');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일만 업로드 가능합니다.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                analyzeBtn.style.display = 'inline-block';
                hideResult();
            };
            reader.readAsDataURL(file);
        }

        analyzeBtn.addEventListener('click', async () => {
            await analyzeImage();
        });

        async function analyzeImage() {
            const loading = document.getElementById('loading');
            loading.classList.add('show');
            analyzeBtn.disabled = true;

            try {
                if (!model) {
                    const modelURL = URL + "model.json";
                    const metadataURL = URL + "metadata.json";
                    model = await tmImage.load(modelURL, metadataURL);
                    maxPredictions = model.getTotalClasses();
                }

                const prediction = await model.predict(previewImage);
                displayResult(prediction);
            } catch (error) {
                console.error('Analysis error:', error);
                alert('분석 중 오류가 발생했습니다.');
            } finally {
                loading.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        }

        // Display result
        function displayResult(prediction) {
            const resultContainer = document.getElementById('result-container');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const probabilityBars = document.getElementById('probability-bars');
            const resultDescription = document.getElementById('result-description');

            // Find the dominant prediction
            let dogProb = 0, catProb = 0;
            prediction.forEach(p => {
                const className = p.className.toLowerCase();
                if (className.includes('dog') || className.includes('강아지') || className.includes('개')) {
                    dogProb = p.probability;
                } else if (className.includes('cat') || className.includes('고양이')) {
                    catProb = p.probability;
                }
            });

            // If class names don't match, use first two predictions
            if (dogProb === 0 && catProb === 0 && prediction.length >= 2) {
                dogProb = prediction[0].probability;
                catProb = prediction[1].probability;
            }

            const isDog = dogProb > catProb;

            // Update display
            if (isDog) {
                resultIcon.textContent = '🐕';
                resultTitle.textContent = '강아지상';
                resultTitle.className = 'result-title result-dog';
            } else {
                resultIcon.textContent = '🐱';
                resultTitle.textContent = '고양이상';
                resultTitle.className = 'result-title result-cat';
            }

            // Probability bars
            probabilityBars.innerHTML = `
                <div class="prob-item">
                    <div class="prob-label">
                        <span>🐕 강아지상</span>
                        <span>${(dogProb * 100).toFixed(1)}%</span>
                    </div>
                    <div class="prob-bar">
                        <div class="prob-fill dog" style="width: ${dogProb * 100}%"></div>
                    </div>
                </div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span>🐱 고양이상</span>
                        <span>${(catProb * 100).toFixed(1)}%</span>
                    </div>
                    <div class="prob-bar">
                        <div class="prob-fill cat" style="width: ${catProb * 100}%"></div>
                    </div>
                </div>
            `;

            // Random description
            const descList = isDog ? descriptions.dog : descriptions.cat;
            resultDescription.textContent = descList[Math.floor(Math.random() * descList.length)];

            resultContainer.classList.add('show');
        }

        function hideResult() {
            document.getElementById('result-container').classList.remove('show');
        }
    </script>
</body>
</html>
