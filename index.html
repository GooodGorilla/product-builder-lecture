<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Dinner Menu Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="language-switcher">
        <button id="lang-ko">Korean</button>
        <button id="lang-en">English</button>
    </div>
    <div class="lotto-machine">
        <h1 data-i18n="heading">Dinner Menu Recommendation</h1>
        <div id="menu-recommendation" class="display"></div>
        <button id="recommend-button" class="draw-button" data-i18n="button">Get Recommendation</button>
    </div>
    <div id="drop-area">
        <p>Drag and drop images here to add them to the menu.</p>
    </div>
    <div class="theme-switcher">
        <button id="theme-toggle" data-i18n="theme_toggle">Toggle Theme</button>
    </div>
    <script src="main.js" type="module"></script>
</body>
</html>
