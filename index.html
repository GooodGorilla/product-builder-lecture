<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Dinner Menu Recommendation</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7091768814337632"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-7091768814337632">
</head>
<body>
    <div class="language-switcher">
        <button id="lang-ko">Korean</button>
        <button id="lang-en">English</button>
    </div>
    <div class="lotto-machine">
        <h1 data-i18n="heading">Dinner Menu Recommendation</h1>
        <div id="menu-recommendation" class="display"></div>
        <button id="recommend-button" class="draw-button" data-i18n="button">Get Recommendation</button>
    </div>

    <div class="theme-switcher">
        <button id="theme-toggle" data-i18n="theme_toggle">Toggle Theme</button>
    </div>
    <div class="animal-test-link">
        <a href="animal.html" class="animal-test-btn">🐕 동물상 테스트 하러가기 🐱</a>
    </div>
    <script src="main.js" type="module"></script>

    <div class="contact-form-section">
        <h2 data-i18n="contact_heading">Partnership Inquiry</h2>
        <form action="https://formspree.io/f/xykjvype" method="POST" class="contact-form">
            <label for="name" data-i18n="name_label">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email" data-i18n="email_label">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message" data-i18n="message_label">Your Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" data-i18n="send_button">Send</button>
        </form>
    </div>
</body>
</html>
